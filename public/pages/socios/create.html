<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Socio - Biblioteca</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <div class="layout-wrapper">
        
        <!-- El Sidebar se inyecta aquí automáticamente por layout.js -->

        <main class="main-content">
            
            <header class="page-header">
                <h1>Nuevo Socio</h1>
                <a href="/pages/socios/" class="btn-text" style="text-decoration: none;">Volver a la lista</a>
            </header>

            <div style="max-width: 800px; background-color: var(--bg-surface); padding: 2rem; border-radius: var(--radius-card); border: 1px solid var(--border-color); box-shadow: var(--shadow-card);">
                <form id="create-form" class="form-minimal" style="grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    
                    <!-- Fila 1: Datos Principales -->
                    <div class="field" style="grid-column: span 2;">
                        <label>Nombre Completo *</label>
                        <div class="input-wrapper">
                            <input type="text" id="nombre_completo" placeholder="Ej: Ana Gómez" required>
                        </div> 
                    </div>
                    
                    <div class="field">
                        <label>DNI (Opcional)</label>
                        <div class="input-wrapper">
                            <input type="text" id="dni" placeholder="Sin puntos">
                        </div>
                    </div>

                    <div class="field">
                        <label>Tipo de Socio *</label>
                        <div class="input-wrapper">
                            <select id="tipo_socio" required>
                                <option value="Alumno">Alumno</option>
                                <option value="Docente">Docente</option>
                                <option value="Personal">Personal</option>
                            </select>
                        </div>
                    </div>

                    <!-- CAMPO CURSO (Oculto por defecto con style="display: none;") -->
                    <div class="field" id="curso-container" style="display: none;">
                        <label>Curso</label>
                        <div class="input-wrapper">
                            <input type="text" id="curso" placeholder="Ej: 3ro B">
                        </div>
                    </div>

                    <!-- Fila 2: Contacto -->
                    <div class="field">
                        <label>Teléfono</label>
                        <div class="input-wrapper">
                            <input type="text" id="telefono" placeholder="Ej: 1122334455">
                        </div>
                    </div>

                    <div class="field">
                        <label>Email</label>
                        <div class="input-wrapper">
                            <input type="email" id="email" placeholder="correo@ejemplo.com">
                        </div>
                    </div>
                    
                    <div class="field" style="grid-column: span 2; margin-top: 2rem;">
                        <button type="submit" class="btn-minimal">Guardar Socio</button>
                    </div>

                </form>
            </div>

        </main>
    </div>

    <script src="/js/layout.js"></script>
    <script src="/js/socios/create.js"></script>

</body>
</html>
