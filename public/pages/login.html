<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Biblioteca</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-dots">

    <!-- Tarjeta de Login -->
    <div class="login-card">
        
        <!-- Icono superior -->
        <div class="logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 24px; height: 24px;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
            </svg>
        </div>

        <h2>Ingresa a la Biblioteca</h2>
        <p class="subtitle">Bienvenido de nuevo. Ingresa tus credenciales.</p>
        
        <form id="loginForm">
            
            <!-- Campo Email -->
            <div class="field">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" required placeholder="admin@biblioteca.com" autocomplete="email">
                </div>
            </div>
            
            <!-- Campo Contraseña -->
            <div class="field">
                <div class="label-row">
                    <label for="password">Contraseña</label>
                    <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>
                <div class="input-wrapper">
                    <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                    <button type="button" class="input-icon-right">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 16px; height: 16px;">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Botón Continuar -->
            <button type="submit" class="btn-primary">
                Continuar
            </button>
            
            <!-- Botón Alternativo (Opcional, como en la imagen) -->
            <button type="button" class="btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 16px; height: 16px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                </svg>
                Enviar un enlace de acceso
            </button>
            
            <div id="error-message" class="error-message"></div>
        </form>
    </div>

    <!-- Footer fuera de la tarjeta -->
    <div class="footer-text">
        ¿No tienes una cuenta? <a href="#">Contacta al administrador</a>
        <div class="footer-subtext">Sistema de Gestión Escolar</div>
    </div>

    <script src="/js/auth.js"></script>
        <!-- Incluir Toast ANTES del auth -->
    <script src="/js/toast.js"></script>
</body>
</html>
